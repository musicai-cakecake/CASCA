# Tiny DiT backbone for XMIDI smoke / debugging (~25M params).
# Use this for milestone-by-milestone unit tests before scaling up.
name: xmidi_tiny
type: ddit
hidden_size: 256
cond_dim: 64
length: 5120
n_blocks: 6
n_heads: 8
scale_by_sigma: True
dropout: 0.1
tie_word_embeddings: True
adaln: False
attn_backend: sdpa
