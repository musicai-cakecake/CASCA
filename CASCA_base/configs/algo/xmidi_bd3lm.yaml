# XMIDI variant of BD3-LM.
#
# Legacy 10x512 XMIDI variant. Runtime dispatch remains `name: bd3lm`;
# dataset-specific region masks and 2-D RoPE are selected by `data.train`.
name: bd3lm
backbone: dit
parameterization: subs
time_conditioning: False
T: 0
causal_attention: False
dropout: 0.0
ignore_bos: False           # XMIDI has no real BOS; do not protect index 0
cross_attn: True            # noisy ⊕ clean concatenation (paper Sec. 3.2)
var_min: True
clip_search_delta: 0.05
clip_search_widths: []
fix_clipping: False
sampler: semi_ar
mdlm_loss_scale: False
